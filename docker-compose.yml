services:
  smart-inspect:
    container_name: smart-inspect
    image: smart-inspect:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
