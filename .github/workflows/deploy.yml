name: Production CI/CD (Build & Deploy)

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/korolev2512/sminspect

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server pulls from GHCR (fast inbound, only changed layers) instead
      # of receiving the whole image over SSH, which took 12–30+ minutes.
      - name: 📦 Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MAPTILER_KEY=${{ secrets.NEXT_PUBLIC_MAPTILER_KEY || 'RUNxFy5DYh1RYPQHDzWi' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to FirstVDS Server via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT || 2337 }}
          SERVER_DIR: /var/www/smart-inspect
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS=(-i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          remote() { ssh "${SSH_OPTS[@]}" -p "$PORT" "$USERNAME@$HOST" "$@"; }

          echo "📁 Ensuring target directory exists on server: $SERVER_DIR..."
          remote "mkdir -p $SERVER_DIR"

          echo "📄 Syncing docker-compose.yml to server..."
          scp "${SSH_OPTS[@]}" -P "$PORT" docker-compose.yml "$USERNAME@$HOST:$SERVER_DIR/docker-compose.yml"

          # The job token is valid only while this job runs; log out right after pulling.
          echo "📥 [1/2] Pulling $IMAGE:$TAG on the server..."
          echo "$GHCR_TOKEN" | remote "docker login ghcr.io -u $GHCR_USER --password-stdin >/dev/null"
          time remote "docker pull -q $IMAGE:$TAG && docker tag $IMAGE:$TAG smart-inspect:latest; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

          echo "🔄 [2/2] Restarting container and cleaning up old images..."
          remote "SERVER_DIR=$SERVER_DIR bash -s" <<'REMOTE'
          set -e
          cd "$SERVER_DIR"
          [ -f .env ] || touch .env

          # A container named smart-inspect may be left over from another
          # compose project (it was once started from /root/sminspect).
          # Compose cannot reuse the name, so remove it before `up`.
          if docker inspect smart-inspect >/dev/null 2>&1; then
            OLD_DIR=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' smart-inspect 2>/dev/null || true)
            if [ "$OLD_DIR" != "$SERVER_DIR" ]; then
              echo "Removing stale smart-inspect container (from '${OLD_DIR:-unknown}')..."
              docker rm -f smart-inspect
            fi
          fi

          docker compose up -d --remove-orphans
          docker image prune -f
          echo 'Health check:'
          docker compose ps
          REMOTE

          echo "✅ Deploy completed successfully!"
