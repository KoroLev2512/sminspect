name: Production CI/CD (Build & Deploy)

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build Docker image (linux/amd64) with Buildx cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: smart-inspect:latest
          build-args: |
            NEXT_PUBLIC_MAPTILER_KEY=${{ secrets.NEXT_PUBLIC_MAPTILER_KEY || 'RUNxFy5DYh1RYPQHDzWi' }}
          outputs: type=docker,dest=/tmp/smart-inspect.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🗜️ Compress Docker image
        run: |
          echo "Compressing Docker image archive..."
          gzip -f /tmp/smart-inspect.tar
          ls -lh /tmp/smart-inspect.tar.gz

      - name: 🚀 Transfer and Deploy to FirstVDS Server via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT || 2337 }}
          SERVER_DIR: /var/www/smart-inspect
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS=(-i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          remote() { ssh "${SSH_OPTS[@]}" -p "$PORT" "$USERNAME@$HOST" "$@"; }

          echo "📁 Ensuring target directory exists on server: $SERVER_DIR..."
          remote "mkdir -p $SERVER_DIR"

          echo "📄 Syncing docker-compose.yml to server..."
          scp "${SSH_OPTS[@]}" -P "$PORT" docker-compose.yml "$USERNAME@$HOST:$SERVER_DIR/docker-compose.yml"

          # Upload first, load second: the server has little RAM, so streaming
          # straight into `docker load` can stall with no visible progress.
          echo "🚚 [1/3] Uploading image archive..."
          time scp "${SSH_OPTS[@]}" -P "$PORT" /tmp/smart-inspect.tar.gz "$USERNAME@$HOST:/tmp/smart-inspect.tar.gz"

          echo "📦 [2/3] Loading image into server dockerd..."
          time remote "docker load -i /tmp/smart-inspect.tar.gz && rm -f /tmp/smart-inspect.tar.gz"

          echo "🔄 [3/3] Restarting container and cleaning up old images..."
          remote "SERVER_DIR=$SERVER_DIR bash -s" <<'REMOTE'
          set -e
          cd "$SERVER_DIR"
          [ -f .env ] || touch .env

          # A container named smart-inspect may be left over from another
          # compose project (it was once started from /root/sminspect).
          # Compose cannot reuse the name, so remove it before `up`.
          if docker inspect smart-inspect >/dev/null 2>&1; then
            OLD_DIR=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' smart-inspect 2>/dev/null || true)
            if [ "$OLD_DIR" != "$SERVER_DIR" ]; then
              echo "Removing stale smart-inspect container (from '${OLD_DIR:-unknown}')..."
              docker rm -f smart-inspect
            fi
          fi

          docker compose up -d --remove-orphans
          docker image prune -f
          echo 'Health check:'
          docker compose ps
          REMOTE

          echo "✅ Deploy completed successfully!"
